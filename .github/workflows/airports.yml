# Airport terminal directories, once a month (the sources "airport-directories" and
# "airport-directories-businesses"; placepacks/indoor/airports.py): gates, terminals, shops, restaurants,
# restrooms, family restrooms, service-animal relief areas, information desks, accessibility services (wheelchair
# assistance, TSA Cares, Sunflower, sensory rooms) and ground transport of US airports with scheduled service, from
# their own websites and public Atrius maps (placepacks/mapvendors/atrius.py).
#
# - When: the 22nd of each month (03:37 UTC), or by hand (Actions, "Airport terminal directories", Run workflow),
#   optionally for some units only ("airports-1").
# - plan: chooses the units and saves the list of airports (OurAirports, websites from Wikidata) once.
# - collect: one job per share of the airports, three at a time; robots.txt obeyed, an identified User-Agent,
#   pauses between requests, and an airport that refuses (403, 429, an anti-bot page) is recorded as "blocked" and
#   left (no CAPTCHA, no login, no headless browser).
# - publish: the only job that can write (contents: write); the month's set goes to the release "airports".
# The pack build (build-packs.yml) reads the newest set in its prepare step. Only the repository's own GITHUB_TOKEN
# is used.
name: Airport terminal directories

on:
  schedule:
    - cron: "37 3 22 * *"
  workflow_dispatch:
    inputs:
      units:
        description: "Units separated by spaces, for example airports-1 (empty: every unit)"
        required: false
        default: ""

# Read-only by default; only publish may write (the "airports" release).
permissions:
  contents: read

concurrency:
  group: airports
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      units: ${{ steps.plan.outputs.units }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # this job pushes no commit: the token is not left in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Choose the units
        id: plan
        env:
          UNITS: ${{ inputs.units }}
        run: |
          # An unknown unit stops here, naming the known ones.
          matrix=$(python -m placepacks.directories.run airports --list --only "$UNITS")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "units=$(python -c 'import json, sys; print(" ".join(u["unit"] for u in json.loads(sys.argv[1])))' "$matrix")" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Save the list of airports once for every unit
        # OurAirports and Wikidata are asked once here, not by every job. When the list cannot be made, each job asks itself.
        run: python -m placepacks.indoor.seeds airports --out airport-seeds.json || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: airports-seeds
          path: airport-seeds.json
          retention-days: 3
          if-no-files-found: ignore

  collect:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # this job pushes no commit: the token is not left in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        continue-on-error: true   # no saved list: the job asks for it itself
        with:
          name: airports-seeds
          path: seeds
      - name: Read the unit
        env:
          AIRPORT_SEEDS: seeds/airport-seeds.json
          UNIT: ${{ matrix.unit }}
        run: python -m placepacks.directories.run airports --unit "$UNIT" --out directory-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ always() }}
        with:
          name: airports-unit-${{ matrix.unit }}
          path: directory-out/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: [plan, collect]
    # Also when some jobs failed or ran out of time: their previous files are kept.
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # this month's set is stored in, and older sets deleted from, the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # this job pushes no commit: the token is not left in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: airports-unit-*
          merge-multiple: true
          path: results
      - name: Publish the set in the release "airports"
        env:
          GH_TOKEN: ${{ github.token }}
          UNITS: ${{ needs.plan.outputs.units }}
        run: |
          mkdir -p results
          python -m placepacks.directories.run airports --publish --dir results --units "$UNITS"
