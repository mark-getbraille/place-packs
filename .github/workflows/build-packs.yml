# Builds and publishes the place packs (README "How the packs are built").
#
# - Every month (the 2nd, 04:17 UTC) it checks every region and rebuilds only those whose sources changed (their
#   versions, ETags or Last-Modified dates differ from the ones recorded in packs.json). Started by hand (Actions,
#   "Build place packs", Run workflow), it builds the regions typed (all when empty), with "force" to rebuild them
#   even when nothing changed, and "seed_history" to seed the US address-range history from older TIGER years.
# - plan: the regions to build. prepare: the national files (NAD, ZIP areas, public and private schools, colleges,
#   libraries, historical counties, Canadian names, GeoNames, the UK's food hygiene ratings, and the Foursquare
#   places of every covered country, read once), split into one
#   slice per region; the NAD (found from its data.transportation.gov metadata) is kept in the Actions cache between
#   runs and downloaded again only when its blobId or rowsUpdatedAt changes. The city and state open-data sources
#   (Socrata portals) and the federal ArcGIS layers (historic places, PAD-US, bridges, dams, airports, stations,
#   parks) are fetched by each region's build job, by the region's box or one small grouped query per dataset. build: one job per region (ten at a time; inside a job four sources at a time, at
#   most two against one host, each stopped at its time limit), core then extra, each merged with the region's
#   previous pack (history is never rewritten); the TIGER history seed is made once per region and kept in the
#   "seeds" release. publish: the new packs under dated names (core and extra in the "packs" release; names,
#   businesses and addresses in their own "packs-detail-YYYYMMDD" release, packs.json "release"), then packs-previous.json (the list before), then
#   packs.json last; then the files neither list names are deleted. Only the repository's own GITHUB_TOKEN is used.
# - Parts: core, extra, names, businesses and addresses (placepacks/fmt.py). Sub-regions: a region too large for one
#   pack (England, Texas, ...) is built as its children (regions.json "children"); each child reads its parent's
#   national slice and its parent's OpenStreetMap extract, clipped with osmium-tool. A child's first build takes its
#   history from its parent's older packs. publish then puts each parent's children together again under the
#   parent's own keys (placepacks.combine), for the programs that know only the parent.
# - Keep-alive: GitHub turns off scheduled workflows in a repository with no activity for 60 days, so every run
#   commits an updated sources-status.md.

name: Build place packs

on:
  schedule:
    - cron: "17 4 2 * *"
  workflow_dispatch:
    inputs:
      regions:
        description: "Region ids separated by spaces or commas, for example us-vermont fr-ile-de-france (empty: all)"
        required: false
        default: ""
      force:
        description: "Rebuild even when no source changed"
        type: boolean
        default: false
      seed_history:
        description: "Seed the US address-range history from older TIGER years (slow; first build only)"
        type: boolean
        default: false
      also_from_run:
        description: "Also publish the packs built by these earlier run ids, separated by spaces (their publish failed); empty: none"
        required: false
        default: ""
      publish_only:
        description: "Build nothing: only publish the packs of the runs in also_from_run"
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: build-place-packs
  cancel-in-progress: false

env:
  RELEASE_TAG: packs
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      regions: ${{ steps.plan.outputs.regions }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Choose the regions whose sources changed
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REGIONS: ${{ inputs.regions }}
          FORCE: ${{ inputs.force }}
          PUBLISH_ONLY: ${{ inputs.publish_only }}
        run: |
          if [ "$PUBLISH_ONLY" = "true" ]; then echo "regions=[]" >> "$GITHUB_OUTPUT"; exit 0; fi
          mkdir -p current
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern packs.json --dir current 2>/dev/null || true
          python -m placepacks.fetch --fingerprint-all "$REGIONS" --out prints.json
          extra=""
          if [ "$FORCE" = "true" ]; then extra="--force"; fi
          python -m placepacks.manifest plan --manifest current/packs.json --fingerprints prints.json --regions "$REGIONS" $extra >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  prepare:
    needs: plan
    if: ${{ needs.plan.outputs.regions != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Make room on the disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      # The NAD (several GB) is kept in the Actions cache, so a busy or rate-limited host does not drop it: the
      # cached copy is used unless the NAD's own version changed (fetch.prepare asks for it first).
      - name: Restore the cached NAD download
        uses: actions/cache/restore@v4
        with:
          path: national/nad
          key: nad-${{ github.run_id }}
          restore-keys: nad-
      # The Newberry atlas (53 MB, changes rarely) is cached the same way: its host times out from the runners.
      - name: Restore the cached Newberry atlas
        uses: actions/cache/restore@v4
        with:
          path: national/newberry-counties
          key: newberry-${{ github.run_id }}
          restore-keys: newberry-
      # The NAD's TXT.zip uses Deflate64, which Python cannot read: it is streamed through unzip (Info-ZIP 6.0) or
      # 7z, both on ubuntu-latest; installed here only if missing.
      - name: Check the zip tools
        run: command -v unzip >/dev/null || (sudo apt-get update && sudo apt-get install -y unzip)
      - name: Download and split the national files
        run: |
          python -m placepacks.fetch --prepare --national national
          python -m placepacks.split national --out national-split
      - name: Save the NAD download in the cache
        if: ${{ hashFiles('national/nad/*.zip') != '' }}
        uses: actions/cache/save@v4
        with:
          path: national/nad
          key: nad-${{ github.run_id }}
      - name: Save the Newberry atlas in the cache
        if: ${{ hashFiles('national/newberry-counties/*.zip') != '' }}
        uses: actions/cache/save@v4
        with:
          path: national/newberry-counties
          key: newberry-${{ github.run_id }}
      - name: Keep the files that are not split
        run: |
          # The files that are not split (read whole by their regions) go with the slices.
          for d in national/*/; do
            id=$(basename "$d")
            if ! ls national-split/*/"$id" >/dev/null 2>&1; then mkdir -p national-whole; mv "$d" national-whole/; fi
          done
          rm -rf national
          du -sh national-split national-whole 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: national-split
          path: national-split/
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: national-whole
          path: national-whole/
          retention-days: 3
          if-no-files-found: ignore

  build:
    needs: [plan, prepare]
    if: ${{ always() && needs.plan.outputs.regions != '[]' && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355   # the hosted maximum is 360
    strategy:
      fail-fast: false
      max-parallel: 10  # each job fetches its sources four at a time with per-host limits (placepacks.fetch)
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.regions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Make room on the disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: national-split
          path: national-split
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: national-whole
          path: national-whole
      # A sub-region's OpenStreetMap is clipped from its parent's extract (fetch.clip_osm).
      - name: Install osmium-tool for a sub-region
        if: ${{ matrix.region.slice != matrix.region.id }}
        # Faster clipping; when the package mirrors are unreachable the pack writer clips without it (slower).
        continue-on-error: true
        run: |
          command -v osmium >/dev/null && exit 0
          for attempt in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y osmium-tool && exit 0
            sleep 30
          done
          exit 1
      - name: Fetch the region's sources and its previous packs
        env:
          GH_TOKEN: ${{ github.token }}
          REGION: ${{ matrix.region.id }}
          SLICE: ${{ matrix.region.slice }}
        run: |
          mkdir -p national previous out
          # A sub-region reads its parent's slice of the national files (the readers keep what is in it).
          if [ -d "national-split/$SLICE" ]; then cp -r "national-split/$SLICE/." national/; fi
          if [ -d national-whole ]; then cp -r national-whole/. national/; fi
          rm -rf national-split national-whole
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern packs.json --dir previous 2>/dev/null || true
          if [ -f previous/packs.json ]; then
            # The region's own older packs, and for a sub-region's first build its parent's (build --list-previous).
            for key in $(python -m placepacks.build "$REGION" --list-previous); do
              # Its file name and its release: names, businesses and addresses are in a "packs-detail-YYYYMMDD" release.
              read -r name release < <(python -c "import json,sys; e=json.load(open('previous/packs.json')).get('packs',{}).get(sys.argv[1],{}); print(e.get('name',''), e.get('release') or sys.argv[2])" "$key" "$RELEASE_TAG")
              if [ -n "$name" ]; then
                gh release download "$release" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir previous
                mv "previous/$name" "previous/$key.osmpack"
              fi
            done
          fi
          python -m placepacks.fetch "$REGION" --dir "work/$REGION" --part all --national national
      - name: Seed the TIGER history (address ranges, landmarks, military installations; first build, when asked)
        if: ${{ inputs.seed_history && startsWith(matrix.region.id, 'us-') }}
        env:
          REGION: ${{ matrix.region.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A finished seed is kept in the "seeds" release as seed-<region>-<fingerprint>.osmpack and reused; it is
          # made again only when the fingerprint changes (the seed years, the seed sources or their entries).
          mkdir -p seed
          FP=$(python -m placepacks.seed fingerprint "$REGION")
          NAME="seed-$REGION-$FP.osmpack"
          prev=""
          if gh release download seeds --repo "$GITHUB_REPOSITORY" --pattern "$NAME" --dir seed 2>/dev/null && [ -f "seed/$NAME" ]; then
            echo "Reusing the stored seed $NAME"
            prev="seed/$NAME"
          else
            SEED=$(python -c "import json; print(','.join(json.load(open('sources.json'))['settings']['tiger_seed_sources']))")
            for year in $(python -c "import json; print(' '.join(json.load(open('sources.json'))['settings']['tiger_seed_years']))"); do
              PLACEPACKS_SETTINGS="{\"tiger_year\": \"$year\"}" python -m placepacks.fetch "$REGION" --dir "seed/$year" --part all --only "$SEED"
              python -m placepacks.build "$REGION" --part all --inputs "seed/$year/fetched.json" --out "seed/$year.osmpack" --month "${year}01" --only "$SEED" --previous "$prev"
              prev="seed/$year.osmpack"
              rm -rf "seed/$year"
            done
            if [ -n "$prev" ]; then
              cp "$prev" "seed/$NAME"
              gh release view seeds --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create seeds --repo "$GITHUB_REPOSITORY" --title "TIGER history seeds" --notes "One finished TIGER history seed per US region (placepacks.seed), reused by later builds; not for download."
              gh release upload seeds "seed/$NAME" --repo "$GITHUB_REPOSITORY" --clobber || echo "The seed could not be stored; the next seeded build makes it again."
              prev="seed/$NAME"
            fi
          fi
          # The seed is the history of the parts that have none yet (build --previous-dir uses previous/seed.osmpack
          # only when neither the part's own older pack nor the packs it came from are there).
          if [ -n "$prev" ]; then cp "$prev" previous/seed.osmpack; fi
          # The seeds of a parent made before its sub-regions are no longer used.
          PARENT=$(python -c "import sys; from placepacks.regions import parent_of; print(parent_of(sys.argv[1]))" "$REGION")
          if [ -n "$PARENT" ]; then
            gh release view seeds --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -E "^seed-$PARENT-[0-9a-f]{12}\.osmpack$" | while read -r old; do
              gh release delete-asset seeds "$old" --repo "$GITHUB_REPOSITORY" -y || true
            done
          fi
      - name: Build the core, extra, businesses, addresses and names packs
        env:
          REGION: ${{ matrix.region.id }}
        run: |
          # Each source prints one line: "source: ok (version, rows)", "source: skipped (reason)" or "source: failed (error)".
          echo "::group::Sources of $REGION"
          python -m placepacks.build "$REGION" --part core --inputs "work/$REGION/fetched.json" --previous-dir previous --out "out/$REGION.osmpack"
          python -m placepacks.build "$REGION" --part extra --inputs "work/$REGION/fetched.json" --previous-dir previous --out "out/$REGION-extra.osmpack"
          # The other parts only for regions that have a source for them (names: other-language names; businesses:
          # Overture and the business lists; addresses: address points and ranges, with their history).
          for part in businesses addresses names; do
            if python -c "import sys; from placepacks import catalogue; r = catalogue.regions()[sys.argv[1]]; sys.exit(0 if catalogue.sources_for(r, sys.argv[2]) else 1)" "$REGION" "$part"; then
              python -m placepacks.build "$REGION" --part "$part" --inputs "work/$REGION/fetched.json" --previous-dir previous --out "out/$REGION-$part.osmpack"
            fi
          done
          echo "::endgroup::"
          mkdir -p "out/fetched/$REGION"
          cp "work/$REGION/fetched.json" "out/fetched/$REGION/"
          rm -rf work national previous seed
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: pack-${{ matrix.region.id }}
          path: out/
          retention-days: 7
          if-no-files-found: error

  # Published whatever the build legs' result: a leg that times out at the job limit is reported "cancelled" (and
  # makes needs.build.result "cancelled" or "failure"), but the regions that finished are not wasted. Only a plan
  # that failed, or a build that never ran, publishes nothing; the step below stops when no pack was built.
  publish:
    needs: [plan, build]
    if: ${{ always() && needs.plan.result == 'success' && (needs.build.result != 'skipped' || inputs.publish_only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: pack-*
          path: built
          merge-multiple: true
      # The packs an earlier run built when its publish failed (also_from_run): this run's own packs, downloaded
      # above, come first and are not replaced.
      # (gh, page by page: download-artifact with run-id sees only the first 100 artifacts of a run.)
      - name: Add the earlier runs' packs
        if: ${{ inputs.also_from_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: ${{ inputs.also_from_run }}
        run: |
          mkdir -p built built/fetched
          for run in $RUNS; do
            case "$run" in *[!0-9]*) echo "Not a run id: $run"; exit 1;; esac
            for page in $(seq 1 10); do
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100&page=$page" --jq '.artifacts[] | select(.expired | not) | .name' | grep '^pack-' || true
            done | sort -u > "artifacts-$run.txt"
            echo "Run $run: $(wc -l < "artifacts-$run.txt") packs."
            while read -r name; do
              rm -rf earlier; mkdir earlier
              for attempt in 1 2 3; do gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$name" --dir earlier && break; sleep 20; done
              cp -rn earlier/. built/
            done < "artifacts-$run.txt"
          done
          rm -rf earlier
          echo "$(ls built | grep -c '\.osmpack$') pack files to publish."
      - name: Publish the packs, then the lists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! ls built/*.osmpack >/dev/null 2>&1; then echo "No pack was built; nothing to publish."; exit 0; fi
          mkdir -p old dist
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title "Place packs" --notes-file RELEASE_NOTES.md
          fi
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern packs.json --dir old 2>/dev/null || true
          # 0. Each parent's core and extra put together from its sub-regions' (a child not rebuilt now comes from the
          #    release), under the parent's keys: the programs that know only the parent still find its towns and streets.
          mkdir -p children
          python -m placepacks.combine plan built old/packs.json | while read -r parent part rest; do
            set -- $rest
            files=""
            while [ $# -ge 2 ]; do
              key="$1"; file="$2"; shift 2
              if [ ! -f "$file" ]; then
                gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$file" --dir children --clobber
                file="children/$file"
              fi
              files="$files $file"
            done
            if [ "$part" = core ]; then out="built/$parent.osmpack"; else out="built/$parent-$part.osmpack"; fi
            python -m placepacks.combine "$parent" "$part" --out "$out" $files || echo "$parent $part could not be put together; its older pack stays."
          done
          rm -rf children
          python -m placepacks.manifest publish --old old/packs.json --built built --fetched-dir built/fetched --output packs.json --uploads uploads.txt
          # The pack releases: "packs" (core and extra, the lists, the licences) and "packs-detail-YYYYMMDD" (the
          # names, businesses and addresses of one publish). GitHub allows 1000 files in a release.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name' | grep -E '^packs(-detail-[0-9]{8})?$' > releases.txt || true
          # 0b. Pack files that no list names (left by a publish that stopped before its list) are deleted first:
          #     no program knows them, and they would take the room of the new ones.
          #     Only with the list before in hand (without it nothing is deleted here).
          if [ -s old/packs.json ]; then
            python -c "import json,sys; sys.path.insert(0,'.'); from placepacks.manifest import referenced_in; print('\n'.join(sorted(referenced_in(json.load(open('old/packs.json'))))))" > known.txt
            while read -r tag; do
              id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.id')
              for page in $(seq 1 10); do
                gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets?per_page=100&page=$page" --jq '.[].name'
              done | grep '\.osmpack$' > names.txt || true
              while read -r name; do
                if ! grep -qxF "$(printf '%s\t%s' "$tag" "$name")" known.txt; then gh release delete-asset "$tag" "$name" --repo "$GITHUB_REPOSITORY" -y; fi
              done < names.txt
            done < releases.txt
          fi
          # 1. The new packs, under dated names (no file a program is downloading is replaced), each in its release.
          while IFS="$(printf '\t')" read -r path asset release; do
            release="${release:-$RELEASE_TAG}"
            if ! grep -qxF "$release" releases.txt; then
              gh release create "$release" --repo "$GITHUB_REPOSITORY" --title "Place packs: detail parts ($release)" --notes "The names, businesses and addresses parts of one publish of the place packs. packs.json in the release \"packs\" lists them." --latest=false
              echo "$release" >> releases.txt
            fi
            cp "$path" "dist/$asset"
            # GitHub sometimes answers an upload with a server error (502): try again, three times at most.
            for attempt in 1 2 3; do
              gh release upload "$release" "dist/$asset" --repo "$GITHUB_REPOSITORY" --clobber && break
              if [ "$attempt" = 3 ]; then exit 1; fi
              echo "The upload of $asset failed; trying again."; sleep 30
            done
            rm "dist/$asset"
          done < uploads.txt
          # 2. The licences, then the list before (packs-previous.json), then the new list last.
          gh release upload "$RELEASE_TAG" LICENSES/*.txt LICENSES.md NOTICE --repo "$GITHUB_REPOSITORY" --clobber
          if [ -f old/packs.json ]; then
            cp old/packs.json dist/packs-previous.json
            gh release upload "$RELEASE_TAG" dist/packs-previous.json --repo "$GITHUB_REPOSITORY" --clobber
          fi
          gh release upload "$RELEASE_TAG" packs.json --repo "$GITHUB_REPOSITORY" --clobber
          # 3. Packs neither list names are deleted (older months stay in packs-previous.json for a month), and a
          #    detail release left with no pack is deleted with its tag.
          python -c "import json,sys; sys.path.insert(0,'.'); from placepacks.manifest import referenced_in; ms=[json.load(open(p)) for p in ('packs.json','dist/packs-previous.json') if __import__('os').path.exists(p)]; print('\n'.join(sorted(referenced_in(*ms))))" > keep.txt
          while read -r tag; do
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.id')
            for page in $(seq 1 10); do
              gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets?per_page=100&page=$page" --jq '.[].name'
            done | grep '\.osmpack$' > names.txt || true
            while read -r name; do
              if ! grep -qxF "$(printf '%s\t%s' "$tag" "$name")" keep.txt; then gh release delete-asset "$tag" "$name" --repo "$GITHUB_REPOSITORY" -y; fi
            done < names.txt
            if [ "$tag" != "$RELEASE_TAG" ] && ! grep -q "^$tag$(printf '\t')" keep.txt; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y
            fi
          done < releases.txt
      - name: Keep the schedule alive (update sources-status.md)
        run: |
          if [ ! -f packs.json ]; then echo "Nothing was published; sources-status.md is left as it is."; exit 0; fi
          python -m placepacks.status packs.json > "$RUNNER_TEMP/sources-status.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # main may have moved while the packs were building: start from its newest commit, then write the file.
          for attempt in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            cp "$RUNNER_TEMP/sources-status.md" sources-status.md
            git add sources-status.md
            git commit -m "Monthly place packs status" || { echo "Nothing to commit"; break; }
            git push origin HEAD:main && break
            echo "The push was refused; trying again."
          done
