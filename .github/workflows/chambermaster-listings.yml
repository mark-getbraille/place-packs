# Reads chambers of commerce's public member directories on the older ChamberMaster platform once a month (the
# source "chambermaster-listings"; placepacks/directories/chambermaster.py).
#
# - When: the 15th of each month (02:47 UTC); or by hand (Actions, "Chambers' directories", Run workflow),
#   optionally for some states only ("units": two-letter codes in lower case separated by spaces, such as "vt oh";
#   empty: every state, DC and Puerto Rico).
# - plan: the list of states (python -m placepacks.directories.run chambermaster --list).
# - collect: one job per state, four at a time. Each job reads the US Chamber of Commerce's directory page of the
#   state (to find the chambers and their websites), each chamber's homepage (to find its directory), and that
#   directory's robots.txt: GrowthZone v2 directories (a 51-byte robots.txt without a sitemap) are left without
#   asking for any of their pages, as their pages answer with an anti-bot challenge. Classic directories: robots.txt
#   obeyed, the SiteMap.xml and the public-facing quick-link pages, 6 seconds apart; members' names, street
#   addresses, phones and websites only (never representatives' names or e-mail forms); home and one-person
#   businesses left out. A chamber's site that refuses is recorded as blocked and left; nothing is ever got round.
# - publish: the only job that can write (contents: write). It puts this month's set together in the release
#   "chambermaster-listings" (placepacks/chains/release.py): a state that was blocked or failed keeps its previous
#   file (up to three months). The newest two sets are kept.
# The pack build places each member's address with the offline NAD geocoder. Only the repository's own GITHUB_TOKEN
# is used.

name: Chambers' directories

on:
  schedule:
    - cron: "47 2 15 * *"
  workflow_dispatch:
    inputs:
      units:
        description: "State codes in lower case separated by spaces, for example vt oh (empty: every state)"
        required: false
        default: ""

# Read-only by default; only publish may write (the "chambermaster-listings" release).
permissions:
  contents: read

concurrency:
  group: chambermaster-listings
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      units: ${{ steps.plan.outputs.units }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # this job pushes no commit: the token is not left in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Choose the states
        id: plan
        env:
          UNITS: ${{ inputs.units }}
        run: |
          # An unknown id stops here, naming the known ones.
          matrix=$(python -m placepacks.directories.run chambermaster --list --only "$UNITS")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "units=$(python -c 'import json, sys; print(" ".join(u["unit"] for u in json.loads(sys.argv[1])))' "$matrix")" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  collect:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # this job pushes no commit: the token is not left in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Read the state's listings
        env:
          UNIT: ${{ matrix.unit }}
        run: python -m placepacks.directories.run chambermaster --unit "$UNIT" --out directory-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ always() }}
        with:
          name: chambermaster-${{ matrix.unit }}
          path: directory-out/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: [plan, collect]
    # Also when some jobs failed or ran out of time: their previous files are kept.
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # this month's set is stored in, and older sets deleted from, the "chambermaster-listings" release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # this job pushes no commit: the token is not left in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: chambermaster-*
          merge-multiple: true
          path: results
      - name: Publish the set in the release "chambermaster-listings"
        env:
          GH_TOKEN: ${{ github.token }}
          UNITS: ${{ needs.plan.outputs.units }}
        run: |
          mkdir -p results
          python -m placepacks.directories.run chambermaster --publish --dir results --units "$UNITS"
