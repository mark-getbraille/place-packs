# Reads US cities' and counties' own lists of public places once a month (the source "city-facilities";
# placepacks/directories/city_facilities.py): city halls, libraries, community, recreation and senior centers,
# pools, police and fire stations and other municipal buildings, with their phone numbers, websites and hours
# where the city gives them.
#
# - When: the 18th of each month (05:17 UTC), two weeks before the packs are built on the 2nd; or by hand (Actions,
#   "Cities' public places", Run workflow), optionally for some states only ("units": codes such as "wa il").
# - discover: sweeps the Socrata catalogue and ArcGIS Hub's search for every keyword (facilities, community
#   centers, libraries, city hall ...), keeps US city and county layers of points with a name field and no people
#   fields (staff directories are never read), maps their fields (name, address, phone, hours, type, website)
#   automatically, applies the hand-kept override list (placepacks/data/city_facilities_overrides.json) and writes
#   the month's layer list. If the catalogues refuse or fail, last month's list is taken from the release.
# - collect: one job per state that has layers, four at a time; each reads its layers through their own open APIs
#   (only the mapped fields), with an identified User-Agent, and stops a layer at once if it refuses (403, 429 or
#   an anti-bot page): that layer is "blocked", the others go on. Nothing is ever got round.
# - publish: the only job that can write (contents: write). It puts this month's set together in the release
#   "city-facilities" (placepacks/chains/release.py; a state that failed keeps its previous file, up to three
#   months) and stores the layer list there as layers-city-facilities.json.
# The pack build (build-packs.yml) reads the newest set in its prepare step. Only the repository's own GITHUB_TOKEN
# is used.

name: Cities' public places

on:
  schedule:
    - cron: "17 5 18 * *"
  workflow_dispatch:
    inputs:
      units:
        description: "State codes separated by spaces, for example wa il (empty: every state that has layers)"
        required: false
        default: ""

# Read-only by default; only publish may write (the "city-facilities" release).
permissions:
  contents: read

concurrency:
  group: city-facilities
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      units: ${{ steps.plan.outputs.units }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # this job pushes no commit: the token is not left in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Find the layers (or take last month's list)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if ! python -m placepacks.directories.city_facilities discover --out city-facilities-layers.json; then
            echo "Discovery failed: last month's list is used."
            gh release download city-facilities --repo "$REPO" --pattern layers-city-facilities.json --clobber
            mv layers-city-facilities.json city-facilities-layers.json
          fi
      - name: Choose the states
        id: plan
        env:
          UNITS: ${{ inputs.units }}
        run: |
          states=$(python -m placepacks.directories.city_facilities states --list city-facilities-layers.json)
          if [ -n "$UNITS" ]; then states="$UNITS"; fi
          # An unknown code stops here, naming the known ones.
          matrix=$(python -m placepacks.directories.run cityfacilities --list --only "$states")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "units=$(python -c 'import json, sys; print(" ".join(u["unit"] for u in json.loads(sys.argv[1])))' "$matrix")" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: city-facilities-layers
          path: city-facilities-layers.json
          retention-days: 7

  collect:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # this job pushes no commit: the token is not left in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: city-facilities-layers
          path: layers
      - name: Read the state's layers
        env:
          UNIT: ${{ matrix.unit }}
          CITY_FACILITIES_LIST: layers/city-facilities-layers.json
        run: python -m placepacks.directories.run cityfacilities --unit "$UNIT" --out directory-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ always() }}
        with:
          name: cityfacilities-${{ matrix.unit }}
          path: directory-out/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: [discover, collect]
    # Also when some jobs failed or ran out of time: their previous files are kept.
    if: ${{ always() && needs.discover.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # this month's set and layer list are stored in, and older sets deleted from, the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # this job pushes no commit: the token is not left in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: cityfacilities-*
          merge-multiple: true
          path: results
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: city-facilities-layers
          path: results
      - name: Publish the set in the release "city-facilities"
        env:
          GH_TOKEN: ${{ github.token }}
          UNITS: ${{ needs.discover.outputs.units }}
        run: |
          mkdir -p results
          python -m placepacks.directories.run cityfacilities --publish --dir results --units "$UNITS"
