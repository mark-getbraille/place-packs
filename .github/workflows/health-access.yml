# Hospital and clinic accessibility, once a month (the source "health-access"; placepacks/health_access): the
# accessibility facts, hours and phone numbers of clinics and hospitals from health insurers' public FHIR provider
# directories (Cigna, Humana, Molina Healthcare: Location records only, never practitioners), and the accessibility
# services hospitals say they offer on their own pages (wheelchairs, interpreters, braille and large print, service
# animals, TTY, accessible parking and entrances, the accessibility desk's phone).
#
# - When: the 10th of each month (02:53 UTC), or by hand (Actions, "Hospital and clinic accessibility", Run
#   workflow), optionally for some units only ("fhir-humana hospital-pages-1").
# - collect: one job per unit, three at a time. Each reads robots.txt first and obeys it, names the project in its
#   User-Agent, waits between requests and stops at once if a site refuses (403, 429 or an anti-bot page): that
#   unit or hospital is "blocked", nothing is ever got round. A unit that runs out of its request budget or the
#   job's time publishes the rows it found ("partial", merged with last month's file). A FHIR directory too big for
#   one job resumes next month at the page where it stopped (the release's list keeps that address; the job reads
#   it with its read-only token), so the whole directory is covered over a few months.
# - publish: the only job that can write (contents: write); the month's set goes to the release "health-access"
#   (placepacks/chains/release.py; a unit that failed keeps its previous file, up to three months).
# The pack build (build-packs.yml) reads the newest set in its prepare step and gives the matching hospitals and
# clinics their details (sources health-access and health-access-businesses). Only the repository's own
# GITHUB_TOKEN is used.

name: Hospital and clinic accessibility

on:
  schedule:
    - cron: "53 2 10 * *"
  workflow_dispatch:
    inputs:
      units:
        description: "Units separated by spaces, for example fhir-humana hospital-pages-1 (empty: every unit)"
        required: false
        default: ""

# Read-only by default; only publish may write (the "health-access" release).
permissions:
  contents: read

concurrency:
  group: health-access
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      units: ${{ steps.plan.outputs.units }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # this job pushes no commit: the token is not left in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Choose the units
        id: plan
        env:
          UNITS: ${{ inputs.units }}
        run: |
          # An unknown unit stops here, naming the known ones.
          matrix=$(python -m placepacks.directories.run healthaccess --list --only "$UNITS")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "units=$(python -c 'import json, sys; print(" ".join(u["unit"] for u in json.loads(sys.argv[1])))' "$matrix")" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  collect:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # this job pushes no commit: the token is not left in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Read the unit
        env:
          UNIT: ${{ matrix.unit }}
          GH_TOKEN: ${{ github.token }}   # read-only here: only to read where a FHIR directory stopped last month
        run: python -m placepacks.directories.run healthaccess --unit "$UNIT" --out directory-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ always() }}
        with:
          name: healthaccess-${{ matrix.unit }}
          path: directory-out/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: [plan, collect]
    # Also when some jobs failed or ran out of time: their previous files are kept.
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # this month's set is stored in, and older sets deleted from, the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # this job pushes no commit: the token is not left in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: healthaccess-*
          merge-multiple: true
          path: results
      - name: Publish the set in the release "health-access"
        env:
          GH_TOKEN: ${{ github.token }}
          UNITS: ${{ needs.plan.outputs.units }}
        run: |
          mkdir -p results
          python -m placepacks.directories.run healthaccess --publish --dir results --units "$UNITS"
