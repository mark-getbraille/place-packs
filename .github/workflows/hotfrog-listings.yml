# Collects business listings from Hotfrog, a free business directory, town by town once a month (the source
# "hotfrog-listings"; placepacks/directories/hotfrog.py). The owner's decision of 27 November 2026: directories
# that answer without a challenge may be searched city by city, adding businesses not already in the packs.
#
# - When: the 12th of each month (01:39 UTC); or by hand (Actions, "Hotfrog business listings", Run workflow),
#   optionally for some states only ("units": two-letter codes in lower case separated by spaces, such as "vt oh";
#   empty: every state, DC and Puerto Rico).
# - plan: the list of states (python -m placepacks.directories.run hotfrog --list).
# - collect: one job per state, TWO at a time (so Hotfrog gets at most one request every two seconds from us).
#   Each job reads Hotfrog's robots.txt (obeyed), the Census Bureau's town population file (to choose the towns of
#   at least 25,000 people, biggest first, as many as the job's 4,800-request budget allows), then one search page
#   per town and kind of business (restaurants, shops, pharmacies, hotels ...), 4 seconds apart, with an
#   identified User-Agent: the businesses' names, street addresses, phones, websites and categories only (never
#   descriptions, reviews or photos); no street address, a post office box, a person's name or an individual's
#   office is left out. A refusal (403, 429, an anti-bot page) stops the state at once ("blocked"); nothing is
#   ever got round.
# - publish: the only job that can write (contents: write). It puts this month's set together in the release
#   "hotfrog-listings" (placepacks/chains/release.py): a state that was blocked or failed keeps its previous file
#   (up to three months). The newest two sets are kept.
# The pack build places each address with the offline NAD geocoder (home addresses are left out) and adds a
# business only when no other source has it (the same phone within 500 m, else the same name within 75 m).
# Only the repository's own GITHUB_TOKEN is used.

name: Hotfrog business listings

on:
  schedule:
    - cron: "39 1 12 * *"
  workflow_dispatch:
    inputs:
      units:
        description: "State codes in lower case separated by spaces, for example vt oh (empty: every state)"
        required: false
        default: ""

# Read-only by default; only publish may write (the "hotfrog-listings" release).
permissions:
  contents: read

concurrency:
  group: hotfrog-listings
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      units: ${{ steps.plan.outputs.units }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # this job pushes no commit: the token is not left in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Choose the states
        id: plan
        env:
          UNITS: ${{ inputs.units }}
        run: |
          # An unknown id stops here, naming the known ones.
          matrix=$(python -m placepacks.directories.run hotfrog --list --only "$UNITS")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "units=$(python -c 'import json, sys; print(" ".join(u["unit"] for u in json.loads(sys.argv[1])))' "$matrix")" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  collect:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # this job pushes no commit: the token is not left in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Read the state's listings
        env:
          UNIT: ${{ matrix.unit }}
        run: python -m placepacks.directories.run hotfrog --unit "$UNIT" --out directory-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ always() }}
        with:
          name: hotfrog-${{ matrix.unit }}
          path: directory-out/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: [plan, collect]
    # Also when some jobs failed or ran out of time: their previous files are kept.
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # this month's set is stored in, and older sets deleted from, the "hotfrog-listings" release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # this job pushes no commit: the token is not left in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: hotfrog-*
          merge-multiple: true
          path: results
      - name: Publish the set in the release "hotfrog-listings"
        env:
          GH_TOKEN: ${{ github.token }}
          UNITS: ${{ needs.plan.outputs.units }}
        run: |
          mkdir -p results
          python -m placepacks.directories.run hotfrog --publish --dir results --units "$UNITS"
