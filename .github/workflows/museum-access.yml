# Museum accessibility, once a month (the source "museum-access"; placepacks/museum_access.py): what US museums'
# own websites say they offer visitors with disabilities (audio description and audio guides, touch tours, braille
# and large print, sign language, assistive listening, wheelchairs, accessible entrances, elevators and restrooms,
# service animals, sensory-friendly programs), for the museums of the IMLS Museum Universe Data File and Wikidata
# that have a website, in eight shares.
#
# - When: the 20th of each month (06:17 UTC), or by hand (Actions, "Museum accessibility", Run workflow),
#   optionally for some shares only ("museums-1 museums-2").
# - plan: chooses the shares and saves the list of museums (IMLS and Wikidata) once for every job.
# - collect: one job per share, three at a time. Each reads robots.txt first and obeys it, names the project in its
#   User-Agent, waits between requests and leaves a museum at once if its site refuses (403, 429 or an anti-bot
#   page): that museum is "blocked", nothing is ever got round (no CAPTCHA, no login, no headless browser).
# - publish: the only job that can write (contents: write); the month's set goes to the release "museum-access"
#   (placepacks/chains/release.py; a share that failed keeps its previous file, up to three months).
# The pack build (build-packs.yml) reads the newest set in its prepare step. Only the repository's own GITHUB_TOKEN
# is used.
name: Museum accessibility

on:
  schedule:
    - cron: "17 6 20 * *"
  workflow_dispatch:
    inputs:
      units:
        description: "Shares separated by spaces, for example museums-1 museums-2 (empty: every share)"
        required: false
        default: ""

# Read-only by default; only publish may write (the "museum-access" release).
permissions:
  contents: read

concurrency:
  group: museum-access
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      units: ${{ steps.plan.outputs.units }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # this job pushes no commit: the token is not left in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Choose the shares
        id: plan
        env:
          UNITS: ${{ inputs.units }}
        run: |
          # An unknown share stops here, naming the known ones.
          matrix=$(python -m placepacks.directories.run museumaccess --list --only "$UNITS")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "units=$(python -c 'import json, sys; print(" ".join(u["unit"] for u in json.loads(sys.argv[1])))' "$matrix")" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Save the list of museums once for every share
        # IMLS's file and Wikidata are read once here, not by every job. When the list cannot be made, each job makes it itself.
        run: python -m placepacks.museum_access seeds --out museum-seeds.json || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: museum-seeds
          path: museum-seeds.json
          retention-days: 3
          if-no-files-found: ignore

  collect:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # this job pushes no commit: the token is not left in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        continue-on-error: true   # no saved list: the job makes it itself
        with:
          name: museum-seeds
          path: seeds
      - name: Read the share
        env:
          MUSEUM_SEEDS: seeds/museum-seeds.json
          UNIT: ${{ matrix.unit }}
        run: python -m placepacks.directories.run museumaccess --unit "$UNIT" --out directory-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ always() }}
        with:
          name: museumaccess-unit-${{ matrix.unit }}
          path: directory-out/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: [plan, collect]
    # Also when some jobs failed or ran out of time: their previous files are kept.
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # this month's set is stored in, and older sets deleted from, the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # this job pushes no commit: the token is not left in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: museumaccess-unit-*
          merge-multiple: true
          path: results
      - name: Publish the set in the release "museum-access"
        env:
          GH_TOKEN: ${{ github.token }}
          UNITS: ${{ needs.plan.outputs.units }}
        run: |
          mkdir -p results
          python -m placepacks.directories.run museumaccess --publish --dir results --units "$UNITS"
