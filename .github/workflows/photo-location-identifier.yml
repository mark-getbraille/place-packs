# Photo Location Identifier: test, build the Windows installer, smoke-test it, and publish a release.
#
# Every push and pull request that touches the program (or placepacks, which it uses) runs the tests and builds and
# smoke-tests the installer. A release "photo-location-identifier-v<version>" with the installer is published when
# the workflow is started by hand (Actions, Run workflow) or by pushing a tag "photo-location-identifier-v*".
name: Photo Location Identifier

on:
  push:
    branches: ["**"]
    tags: ["photo-location-identifier-v*"]
    paths:
      - "photo-location-identifier/**"
      - "placepacks/**"
      - ".github/workflows/photo-location-identifier.yml"
  pull_request:
    paths:
      - "photo-location-identifier/**"
      - "placepacks/**"
      - ".github/workflows/photo-location-identifier.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: photo-location-identifier
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: photo-location-identifier/requirements-build.txt

      - name: Install what the build needs
        run: python -m pip install -r requirements-build.txt

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = python -c "import pli; print(pli.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: The manual's HTML and text are up to date
        run: python tools/make_manual.py --check

      - name: Tests (including every window's accessibility)
        run: python -m pytest -q tests

      - name: Build the program (PyInstaller)
        run: pyinstaller --noconfirm --clean installer/pli.spec

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\pli.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist\*.exe

      - name: Smoke test (install silently, sort made-up Outer Banks photos, undo, uninstall)
        run: python tools/smoke_test.py dist/PhotoLocationIdentifier-${{ steps.version.outputs.version }}-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoLocationIdentifier-${{ steps.version.outputs.version }}-setup
          path: photo-location-identifier/dist/PhotoLocationIdentifier-${{ steps.version.outputs.version }}-setup.exe
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/photo-location-identifier-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PhotoLocationIdentifier-${{ needs.build.outputs.version }}-setup

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="photo-location-identifier-v${VERSION}"
          file="PhotoLocationIdentifier-${VERSION}-setup.exe"
          cat > notes.md <<EOF
          Photo Location Identifier ${VERSION}: sorts a folder of pictures into folders named by where and when they
          were taken (for example Outer Banks 2005, Outer Banks 2006). Right-click a folder in File Explorer and
          choose "Sort pictures by location".

          Download ${file} and open it. Windows may say "Windows protected your PC" because the program is not
          signed: choose "More info", then "Run anyway". Everything runs on your computer; only the free place
          packs are downloaded, when you allow it.

          Place names: (c) OpenStreetMap contributors (ODbL) and other open sources; see SOURCES.md.
          EOF
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" "$file" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$file" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Photo Location Identifier ${VERSION}" --notes-file notes.md
          fi
