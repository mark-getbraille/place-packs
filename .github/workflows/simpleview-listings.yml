# Reads tourism boards' visitor listings on the Simpleview platform once a month (the source "simpleview-listings";
# placepacks/directories/simpleview.py).
#
# - When: the 25th of each month (03:23 UTC), a week before the packs are built on the 2nd; or by hand (Actions,
#   "Tourism boards' listings", Run workflow), optionally for some sites only ("units": ids separated by spaces, such
#   as "visitdenver iloveny"; empty: every site).
# - plan: the list of sites (python -m placepacks.directories.run simpleview --list).
# - collect: one job per site, four at a time, each stopped at its own time limit; one site failing never stops the
#   others. Each job reads robots.txt (obeyed; its Crawl-delay kept, 2 to 5 seconds between requests), the sitemap
#   and each listing page (schema.org JSON-LD and the page's listing data: name, address, position, phone, website,
#   category, hours and accessibility; never the e-mail, description, photos or reviews), with an identified
#   User-Agent, and stops at once if the site refuses (403, 429 or an anti-bot page): that site is "blocked".
#   Nothing is ever got round: no CAPTCHA, no browser, no login, no other address.
# - publish: the only job that can write (contents: write). It puts this month's set together in the release
#   "simpleview-listings" (placepacks/chains/release.py): a site that was blocked, failed or found far fewer
#   listings than last time keeps its previous file (up to three months). The newest two sets are kept.
# The pack build (build-packs.yml) reads the newest set in its prepare step. Only the repository's own GITHUB_TOKEN
# is used.

name: Tourism boards' listings

on:
  schedule:
    - cron: "23 3 25 * *"
  workflow_dispatch:
    inputs:
      units:
        description: "Site ids separated by spaces, for example visitdenver iloveny (empty: every site; the list is in placepacks/directories/simpleview.py)"
        required: false
        default: ""

# Read-only by default; only publish may write (the "simpleview-listings" release).
permissions:
  contents: read

concurrency:
  group: simpleview-listings
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      units: ${{ steps.plan.outputs.units }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # this job pushes no commit: the token is not left in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Choose the sites
        id: plan
        env:
          UNITS: ${{ inputs.units }}
        run: |
          # An unknown id stops here, naming the known ones.
          matrix=$(python -m placepacks.directories.run simpleview --list --only "$UNITS")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "units=$(python -c 'import json, sys; print(" ".join(u["unit"] for u in json.loads(sys.argv[1])))' "$matrix")" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  collect:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # this job pushes no commit: the token is not left in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Read the site's listings
        env:
          UNIT: ${{ matrix.unit }}
        run: python -m placepacks.directories.run simpleview --unit "$UNIT" --out directory-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ always() }}
        with:
          name: simpleview-${{ matrix.unit }}
          path: directory-out/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: [plan, collect]
    # Also when some jobs failed or ran out of time: their previous files are kept.
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # this month's set is stored in, and older sets deleted from, the "simpleview-listings" release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # this job pushes no commit: the token is not left in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: simpleview-*
          merge-multiple: true
          path: results
      - name: Publish the set in the release "simpleview-listings"
        env:
          GH_TOKEN: ${{ github.token }}
          UNITS: ${{ needs.plan.outputs.units }}
        run: |
          mkdir -p results
          python -m placepacks.directories.run simpleview --publish --dir results --units "$UNITS"
