# Reads businesses' own homepages once a month for their phone number and opening hours (the source
# "business-websites"; placepacks/directories/websites.py).
#
# - When: the 20th of each month (04:17 UTC), well before the packs are built on the 2nd; or by hand (Actions,
#   "Business websites", Run workflow), optionally with another number of jobs or another budget.
# - plan: the list of jobs (python -m placepacks.directories.websites plan).
# - collect: one job per share of the regions (every tenth region in population order), three at a time. Each job
#   reads the newest published businesses packs of its regions, picks the businesses that have a website but no
#   phone or no hours (never read first, none again within 180 days; not a chain's store, not a website several
#   places share), and reads each homepage once: robots.txt first, always obeyed; an identified User-Agent; at
#   least a second between requests to a host; only the schema.org data of one local business (phone and hours,
#   never an e-mail). A site that refuses or sends an anti-bot page is recorded as "blocked" and left. The job's
#   rows and summary are uploaded as an artifact.
# - publish: the only job that can write (contents: write). It merges the jobs' rows into the newest file of the
#   release "web-details" and uploads it as web-details-<YYYYMMDD>.csv.gz (the newest two kept). The table of the
#   run is in the job summary.
# The pack build (build-packs.yml) reads the newest file in its prepare step. Only the repository's own GITHUB_TOKEN
# is used.

name: Business websites

on:
  schedule:
    - cron: "17 4 20 * *"
  workflow_dispatch:
    inputs:
      shards:
        description: "Number of jobs (default 10)"
        required: false
        default: "10"
      budget:
        description: "Homepages per job (empty: 30,000 a month split over the jobs)"
        required: false
        default: ""

# Read-only by default; only publish may write (the "web-details" release).
permissions:
  contents: read

concurrency:
  group: web-details
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # this job pushes no commit: the token is not left in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Choose the jobs
        id: plan
        env:
          SHARDS: ${{ inputs.shards || '10' }}
        run: |
          echo "matrix=$(python -m placepacks.directories.websites plan --shards "$SHARDS")" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  collect:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # this job pushes no commit: the token is not left in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Read the homepages of this job's businesses
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
          OF: ${{ matrix.of }}
          BUDGET: ${{ inputs.budget }}
        run: |
          python -m placepacks.directories.websites collect --shard "$SHARD" --of "$OF" --budget "${BUDGET:-0}" \
            --minutes 300 --out web-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ always() }}
        with:
          name: web-details-${{ matrix.shard }}
          path: web-out/
          retention-days: 7
          if-no-files-found: ignore

  publish:
    needs: [plan, collect]
    # Also when some jobs failed or ran out of time: the rows of the others are merged.
    if: ${{ always() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # the merged file is stored in, and older files deleted from, the "web-details" release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false   # this job pushes no commit: the token is not left in .git/config
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: web-details-*
          merge-multiple: true
          path: results
      - name: Publish the merged file in the release "web-details"
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m placepacks.directories.websites publish --dir results
